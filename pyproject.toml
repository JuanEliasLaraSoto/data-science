[project]
name = "credit-risk-lab"
version = "0.1.0"
description = "Credit risk modelling lab: WoE scorecard, independent model validation, Vasicek Monte Carlo and macro stress testing."
readme = "README.md"
authors = [{ name = "Juan Elías Lara Soto" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_lab"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "NPY", # numpy-specific rules (e.g. legacy np.random API)
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "D",   # pydocstyle
]
ignore = [
    "N803", # allow math-style argument names (X, N, ...)
    "N806", # allow math-style local names (X, N, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["sklearn.*", "statsmodels.*", "seaborn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=credit_risk_lab --cov-report=term-missing"

[tool.coverage.run]
source = ["credit_risk_lab"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
